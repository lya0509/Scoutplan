<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#612499">
<title>Verificar carnet Scout</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --bg: #f4f1f9; --card: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
    --brand: #612499; --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef9c3;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #7e22ce; --info-bg: #f3e8ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120d1a; --card: #1e1729; --ink: #f3f4f6; --muted: #a1a1aa; --line: #2e2540;
      --ok-bg: #14532d; --ok: #86efac; --warn-bg: #422006; --warn: #fde047;
      --bad-bg: #450a0a; --bad: #fca5a5; --info-bg: #3b0764; --info: #d8b4fe;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px;
    border: 1px solid var(--line); overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .top { background: var(--brand); color: #fff; padding: 18px 20px; display: flex; gap: 12px; align-items: center; }
  .top img { width: 40px; height: 40px; border-radius: 10px; background: #fff; }
  .top small { display: block; opacity: .85; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .top strong { font-size: 17px; }
  .body { padding: 22px 20px 20px; }
  .badge { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 12px 14px;
    font-weight: 700; font-size: 16px; margin-bottom: 18px; }
  .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .bad { background: var(--bad-bg); color: var(--bad); }
  .info { background: var(--info-bg); color: var(--info); }
  .name { font-size: 22px; font-weight: 800; margin: 0 0 4px; overflow-wrap: anywhere; }
  dl { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .foot { border-top: 1px solid var(--line); padding: 12px 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: s 0.8s linear infinite; margin: 18px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { line-height: 1.5; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="top">
    <img src="/icon-192.png" alt="">
    <div><small>Asociación de Scouts de Venezuela</small><strong>Verificación de carnet</strong></div>
  </div>
  <div class="body" id="out"><div class="spin" role="status" aria-label="Verificando"></div></div>
  <div class="foot" id="foot">Esta página solo muestra el nombre, el grupo y el estado de la membresía. No se publican datos personales.</div>
</main>
<script>
(function () {
  var out = document.getElementById('out');
  var foot = document.getElementById('foot');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
  var message = function (cls, title, text) {
    out.innerHTML = '<div class="badge ' + cls + '"><span class="dot"></span>' + esc(title) + '</div><p>' + esc(text) + '</p>';
  };

  var parts = location.pathname.split('/').filter(Boolean);
  var id = parts[0] === 'verificar' ? parts[1] : new URLSearchParams(location.search).get('id');
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
    message('bad', 'Código no válido', 'El enlace o el código QR no corresponde a un carnet. Escanéalo de nuevo desde el carnet digital.');
    return;
  }

  fetch('/api/verificar?id=' + encodeURIComponent(id), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      var d = res.body || {};
      if (res.status === 404) return message('bad', 'Carnet no encontrado', 'No hay ningún miembro registrado con este código.');
      if (res.status === 503) return message('warn', 'Verificación no disponible', 'El servicio de verificación todavía no está activo. Pide al miembro que muestre su carnet en la app.');
      if (res.status !== 200) return message('warn', 'No se pudo verificar', 'Ocurrió un problema en el servidor. Inténtalo de nuevo en unos minutos.');

      var badge = {
        vigente: ['ok', 'Membresía vigente'],
        vencida: ['bad', 'Membresía vencida'],
        por_aprobar: ['info', 'Membresía en revisión'],
        sin_membresia: ['warn', 'Sin membresía registrada'],
      }[d.status] || ['warn', 'Estado desconocido'];

      var rows = '';
      if (d.group) rows += '<dt>Grupo</dt><dd>' + esc(d.group) + '</dd>';
      if (d.cargo) rows += '<dt>Rama / cargo</dt><dd>' + esc(d.cargo) + '</dd>';
      if (d.expires) rows += '<dt>' + (d.status === 'vencida' ? 'Venció' : 'Vence') + '</dt><dd>' + esc(fmt(d.expires)) + '</dd>';

      out.innerHTML =
        '<div class="badge ' + badge[0] + '"><span class="dot"></span>' + esc(badge[1]) + '</div>' +
        '<h1 class="name">' + esc(d.name) + '</h1>' +
        (rows ? '<dl>' + rows + '</dl>' : '');
      var when = new Date(d.checked_at || Date.now());
      foot.textContent = 'Solo se muestran nombre, grupo y estado de la membresía. Consultado el ' +
        when.toLocaleDateString('es-VE') + ', ' +
        when.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });
    })
    .catch(function () {
      message('warn', 'Sin conexión', 'Para verificar el carnet necesitas internet. Revisa tu conexión e inténtalo de nuevo.');
    });
})();
</script>
</body>
</html>
