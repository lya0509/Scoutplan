<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- SEO & Metadata para Google -->
    <meta name="description" content="Aplicación oficial del Plan Progresivo y Adelanto Scout de la Asociación de Scouts de Venezuela (ASV). Registro digital de etapas, insignias, especialidades, ficha médica y cancionero." />
    <meta name="keywords" content="scout, plan de adelanto, plan progresivo, asociacion de scouts de venezuela, asv, rovers, tropa, manada, caminantes, scout venezuela, adelanto scout, scoutplan" />
    <meta name="author" content="Asociación de Scouts de Venezuela" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph para Redes Sociales y WhatsApp -->
    <meta property="og:title" content="Plan Progresivo Scout - ASV" />
    <meta property="og:description" content="Plataforma digital de adelanto scout. Registra tus etapas, insignias, fichas médicas y cancionero offline." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Plan Progresivo Scout - ASV" />
    <meta name="twitter:description" content="Plataforma digital de Plan Progresivo y Adelanto Scout." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#612499" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plan Progresivo" />
    <meta name="application-name" content="Plan Progresivo" />
    <meta name="msapplication-TileColor" content="#612499" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
