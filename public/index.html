    <!-- Animación de inicio: arranca igual que la pantalla del ícono que pone el teléfono y

         cargar la app desde cero; App la retira con window.__hideScoutSplash(). -->
    <style id="scout-splash-css">
      #scout-splash {
        --dx: 0px; --dy: 0px; --s0: 1;
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #612499; /* mismo morado liso que la pantalla del teléfono */
        overflow: hidden; transition: opacity .45s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #scout-splash .ss-glow {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 45%, rgba(150,90,210,.55) 0%, rgba(150,90,210,0) 62%);
        animation: ss-fadein .9s ease .25s both;
      }
      #scout-splash .ss-stage { position: relative; display: flex; flex-direction: column; align-items: center; transition: transform .45s cubic-bezier(.4,0,.2,1); }
      #scout-splash .ss-logo { position: relative; width: min(56vw, 240px); transform-origin: 50.11% 47.30%; will-change: transform; }
      #scout-splash .ss-logo svg { display: block; width: 100%; height: auto; overflow: visible; fill: #fff; fill-rule: evenodd; }
      #scout-splash .ss-layer { position: absolute; inset: 0; will-change: transform; }
      #scout-splash .ss-fleurL { transform-origin: 50.12% 46.02%; }
      #scout-splash .ss-knotL { transform-origin: 50.06% 91.94%; }
      #scout-splash .ss-title { margin-top: 26px; color: #fff; text-align: center; }
      #scout-splash .ss-title b { display: block; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
      #scout-splash .ss-title span { display: block; margin-top: 4px; font-size: 13px; opacity: .78; letter-spacing: .3px; }
      #scout-splash.ss-out { opacity: 0; pointer-events: none; }
      #scout-splash.ss-out .ss-stage { transform: scale(1.08); }
      /* Empieza con el logo del tamaño y en el lugar de la pantalla del teléfono (--dx, --dy, --s0) */
      @keyframes ss-grow { from { transform: translate(var(--dx), var(--dy)) scale(var(--s0)); } to { transform: none; } }
      @keyframes ss-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes ss-rise { 0% { transform: translateY(12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
      @keyframes ss-fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ss-hide { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #scout-splash *, #scout-splash *::before { animation: none !important; }
      }
      #scout-splash .ss-logo { animation: ss-grow .85s cubic-bezier(.65,0,.25,1) .3s both, ss-breathe 1.8s ease-in-out 2s infinite; }
      #scout-splash .ss-fleurL { animation: ss-twirl 1.05s cubic-bezier(.45,0,.25,1) .3s both; }
      #scout-splash .ss-knotL { animation: ss-tie .5s ease-out 1.05s both; }
      #scout-splash .ss-title { animation: ss-rise .6s ease-out 1.2s both; }
      @keyframes ss-twirl {
        0%   { transform: none; }
        45%  { transform: translateY(-5%) rotate(210deg); }
        78%  { transform: rotate(378deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ss-tie { 0% { transform: none; } 35% { transform: scale(1.35); } 100% { transform: none; } }
    </style>

    <script>
      (function () {
        var el = document.getElementById('scout-splash');
        if (!el) return;
        // Arranca con el logo del mismo tamaño y en el mismo lugar que la pantalla que pone el
        // teléfono al abrir la app instalada (círculo ≈ 36 % del ancho, al centro de la pantalla).
        try {
          var logo = el.querySelector('.ss-logo'), r = logo.getBoundingClientRect();
          var W = window.innerWidth, H = window.innerHeight;
          var ringFinal = 0.9448 * r.width, ringStart = Math.min(0.361 * W, 160);
          el.style.setProperty('--s0', String(ringStart / ringFinal));
          el.style.setProperty('--dx', (W / 2 - (r.left + 0.5011 * r.width)) + 'px');
          el.style.setProperty('--dy', (H * 0.485 - (r.top + 0.4730 * r.height)) + 'px');
        } catch (e) {}
        var test = !!navigator.webdriver; // pruebas automáticas: se quita al instante
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var introDone = test || still, appReady = false, closing = false;
        function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
        function close() {
          if (closing) return;
          closing = true;
          if (test) return remove();
          el.className = 'ss-out';
          setTimeout(remove, 500);
        }
        function maybeClose() { if (appReady && introDone) close(); }
        // La app entra cuando la animación TERMINÓ DE VERDAD (último paso: el título).
        el.querySelector('.ss-title').addEventListener('animationend', function () { introDone = true; maybeClose(); });
        window.__hideScoutSplash = function () {
          appReady = true;
          maybeClose();
          setTimeout(close, 4000); // si el navegador no anima (ahorro de batería), no esperar para siempre
        };
        setTimeout(close, 15000); // por si la app no llega a avisar
      })();
    </script>

    <!-- Registro de Service Worker para PWA (Soporte Offline 100%) -->
    <script>
      if ('serviceWorker' in navigator) {
        function registerSW() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('✅ Service Worker PWA activo y listo para modo offline:', reg.scope);
            })
            .catch(function(err) {
              console.warn('⚠️ Error en Service Worker:', err);
            });
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
