name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los dias a las 06:00 UTC (madrugada)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://vumijajwmhvvzissrqbv.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_4OFAGKEFxeT7JpsS5__Fvg_x_lTK-GO" \
            -H "Authorization: Bearer sb_publishable_4OFAGKEFxeT7JpsS5__Fvg_x_lTK-GO")
          
          echo "Supabase HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "✓ Base de datos activa y respondiendo correctamente."
          else
            echo "Aviso: Respuesta recibida con código $HTTP_STATUS, pero la solicitud fue procesada por el servidor de Supabase."
          fi
